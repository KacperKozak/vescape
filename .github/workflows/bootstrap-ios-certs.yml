name: Bootstrap iOS Certificates

# One-time workflow to generate the distribution certificate and provisioning
# profiles via fastlane match and push them encrypted to the certs repo.
# Run this once before the first iOS release; afterwards CI uses readonly match.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Generate and push certs
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode ASC API key
        run: |
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc.p8" >> "$GITHUB_ENV"
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Generate distribution cert and profiles
        run: bundle exec fastlane ios bootstrap_certs
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ env.ASC_KEY_PATH }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
