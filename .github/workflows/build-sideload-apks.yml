name: Build sideload APKs

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to build
        required: true
        default: main
        type: string

jobs:
  build:
    name: Build matched phone and Wear APKs
    runs-on: ubuntu-latest

    steps:
      - name: Check out requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Read version
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          WEAR_VERSION_CODE=$(node -e "
            const [major, minor, patch] = '$APP_VERSION'.split('.').map(Number);
            const phone = major * 10000 + minor * 100 + patch;
            const wear = 1_000_000_000 + phone;
            if (!Number.isSafeInteger(wear) || wear > 2_100_000_000) {
              throw new Error('Wear versionCode exceeds Play limit');
            }
            process.stdout.write(String(wear));
          ")
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "WEAR_VERSION_CODE=$WEAR_VERSION_CODE" >> "$GITHUB_ENV"
          echo "Building Vescape $APP_VERSION (Wear versionCode $WEAR_VERSION_CODE)"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install dependencies
        run: bun install

      - name: Generate Android project
        run: bunx expo prebuild --platform android --no-install
        env:
          EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_MAPY_API_KEY: ${{ secrets.EXPO_PUBLIC_MAPY_API_KEY }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_POSTHOG_API_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_API_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ secrets.EXPO_PUBLIC_POSTHOG_HOST }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Decode release keystore
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not configured"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          test -s "$RUNNER_TEMP/upload.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build signed phone and Wear APKs
        working-directory: android
        run: |
          export NODE_BINARY=$(command -v node)
          export PATH=$(dirname "$NODE_BINARY"):$PATH
          ./gradlew :app:assembleRelease :wearos:assembleRelease
        env:
          EXPO_PUBLIC_SERVER_URL: https://api.vescape.app
          EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_MAPY_API_KEY: ${{ secrets.EXPO_PUBLIC_MAPY_API_KEY }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_POSTHOG_API_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_API_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ secrets.EXPO_PUBLIC_POSTHOG_HOST }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          ORG_GRADLE_PROJECT_VESCAPE_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.jks
          ORG_GRADLE_PROJECT_VESCAPE_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_VESCAPE_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_VESCAPE_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_APP_VERSION: ${{ env.APP_VERSION }}
          ORG_GRADLE_PROJECT_WEAR_VERSION_CODE: ${{ env.WEAR_VERSION_CODE }}

      - name: Verify matching certificates
        run: |
          PHONE_APK=android/app/build/outputs/apk/release/app-release.apk
          WEAR_APK=android/wearos/build/outputs/apk/release/wearos-release.apk
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          "$APKSIGNER" verify --verbose --print-certs "$PHONE_APK"
          "$APKSIGNER" verify --verbose --print-certs "$WEAR_APK"

          PHONE_CERT=$("$APKSIGNER" verify --print-certs "$PHONE_APK" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          WEAR_CERT=$("$APKSIGNER" verify --print-certs "$WEAR_APK" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p')

          if [ -z "$PHONE_CERT" ] || [ -z "$WEAR_CERT" ]; then
            echo "Could not read APK signing certificate"
            exit 1
          fi
          if [ "$PHONE_CERT" != "$WEAR_CERT" ]; then
            echo "Phone and Wear APK signing certificates differ"
            exit 1
          fi
          echo "Matching certificate: $PHONE_CERT"

      - name: Prepare sideload bundle
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
            "dist/vescape-phone-$APP_VERSION.apk"
          cp android/wearos/build/outputs/apk/release/wearos-release.apk \
            "dist/vescape-watch-$APP_VERSION.apk"

      - name: Upload matched APKs
        uses: actions/upload-artifact@v4
        with:
          name: vescape-sideload-${{ env.APP_VERSION }}
          path: dist/*.apk
          if-no-files-found: error
