name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - run: bun install
      - run: bun run copy:shared
      - name: Environment diagnostic
        run: |
          echo "node: $(node -v) @ $(which node)"
          echo "bun:  $(bun -v)"
          node -p "'typescript: ' + require('typescript').version" || echo "typescript: NOT RESOLVABLE"
          node -p "'stripTypeScriptTypes: ' + (typeof require('node:module').stripTypeScriptTypes)"
      - run: bun x expo prebuild --platform android --no-install
      - run: bun run check:ci
