name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      GRADLE_OPTS: -Dorg.gradle.caching=true -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: useblacksmith/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('bun.lock', 'app.config.ts') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - run: bun install
      - run: bun run copy:shared
      - run: bun x expo prebuild --platform android --no-install
      - run: bun run check:ci
      - name: Release Gradle file handles
        if: always()
        run: cd android && ./gradlew --stop || true

  parallel-probe:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - parallel:
          - name: sleep A
            run: sleep 20
          - name: sleep B
            run: sleep 20
      - run: echo "both done"
