name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      GRADLE_OPTS: -Dorg.gradle.caching=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-android-sdk
          path: /usr/local/lib/android/sdk
      - uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-gradle
          path: /home/runner/.gradle
      - name: Cache probe
        run: |
          echo "literal ~ dir:"; ls -la './~' 2>&1 | head -3
          echo "gradle:"; du -sh /home/runner/.gradle 2>&1
          echo "sdk:"; du -sh /usr/local/lib/android/sdk 2>&1
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - run: bun install
      - run: bun run copy:shared
      - run: bun x expo prebuild --platform android --no-install
      - run: bun run check:ci
