name: Release Android

# Triggered by a tag of the form `production-<version>` (e.g. production-0.65.0)
# pushed on the main branch. The tag version must match package.json exactly.
# Can also be run manually (workflow_dispatch) to produce a signed AAB artifact
# without tagging; the version then comes straight from package.json.
on:
  push:
    tags: ['production-*']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is needed to verify the tag points at a main-branch commit.
          fetch-depth: 0

      # ── Guard: tag must point at a commit on main ──────────────────────────
      - name: Verify tag is on main
        if: github.event_name == 'push'
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "✗ Tagged commit is not on main. Aborting."
            exit 1
          fi
          echo "✓ Tag is on main"

      # ── Guard: tag version must match package.json ─────────────────────────
      - name: Verify version matches package.json
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#production-}"
            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "✗ Tag version ($TAG_VERSION) does not match package.json ($PKG_VERSION). Aborting."
              exit 1
            fi
          fi
          # Phone keeps its existing code. Wear uses a disjoint high range because
          # both AABs share one Play listing and every artifact code must be unique.
          read -r VERSION_CODE WEAR_VERSION_CODE <<< "$(node -e "
            const v = '$PKG_VERSION'.split('.').map(Number);
            const phone = v[0] * 10000 + v[1] * 100 + v[2];
            const wear = 1_000_000_000 + phone;
            if (wear > 2_100_000_000) throw new Error('Wear versionCode exceeds Play limit');
            console.log(phone, wear);
          ")"
          echo "✓ Version $PKG_VERSION (phone $VERSION_CODE, Wear $WEAR_VERSION_CODE)"
          echo "VERSION_CODE=$VERSION_CODE"           >> "$GITHUB_ENV"
          echo "WEAR_VERSION_CODE=$WEAR_VERSION_CODE" >> "$GITHUB_ENV"
          echo "APP_VERSION=$PKG_VERSION"              >> "$GITHUB_ENV"

      # ── Toolchain ──────────────────────────────────────────────────────────
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      # ── JS + native generation ─────────────────────────────────────────────
      - name: Install JS dependencies
        run: bun install

      - name: Copy shared JS into native modules
        run: bun run copy:shared

      - name: Generate android/ via expo prebuild
        # The withAndroidSigningConfig plugin injects the release signingConfig
        # block into the generated app/build.gradle during this step.
        run: bunx expo prebuild --platform android --no-install
        env:
          # Map/telemetry keys are baked into the JS bundle at build time.
          # Add these as GitHub repository secrets if the build fails with
          # "undefined" or missing-token errors.
          EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_MAPY_API_KEY: ${{ secrets.EXPO_PUBLIC_MAPY_API_KEY }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_POSTHOG_API_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_API_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ secrets.EXPO_PUBLIC_POSTHOG_HOST }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      # ── Signing secrets ────────────────────────────────────────────────────
      - name: Decode upload keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "VESCAPE_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Write Play service-account JSON
        run: |
          echo "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"
          echo "SUPPLY_JSON_KEY=$RUNNER_TEMP/play-service-account.json" >> "$GITHUB_ENV"
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

      # ── fastlane ───────────────────────────────────────────────────────────
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true # caches gems; commit Gemfile.lock to speed this up

      - name: Build AAB and publish to Play Store
        run: bundle exec fastlane android release
        env:
          VESCAPE_UPLOAD_STORE_FILE: ${{ env.VESCAPE_UPLOAD_STORE_FILE }}
          VESCAPE_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VESCAPE_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VESCAPE_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPPLY_JSON_KEY: ${{ env.SUPPLY_JSON_KEY }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
          WEAR_VERSION_CODE: ${{ env.WEAR_VERSION_CODE }}
          APP_VERSION: ${{ env.APP_VERSION }}
          # Also pass map/API keys so Metro can bundle them into the AAB
          EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_MAPY_API_KEY: ${{ secrets.EXPO_PUBLIC_MAPY_API_KEY }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_POSTHOG_API_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_API_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ secrets.EXPO_PUBLIC_POSTHOG_HOST }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      # Keep the signed AAB even when the Play upload fails (e.g. a new
      # foreground-service permission needs a manual Console upload first).
      - name: Upload phone AAB artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ env.APP_VERSION }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore

      - name: Upload Wear AAB artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wearos-release-${{ env.APP_VERSION }}
          path: android/wearos/build/outputs/bundle/release/wearos-release.aab
          if-no-files-found: ignore
