# Smoke run on a hosted emulator.
#
# Dispatch-only for now. The run takes ~40 minutes and drives a live UI, so it is not a PR gate
# until it has proven itself stable by hand a few times.
name: Smoke

on:
  # TEMPORARY: `workflow_dispatch` only works once the file is on the default branch, so this is how
  # the workflow gets exercised before it is merged. Remove before this branch lands.
  push:
    branches: [smoke-test]
  workflow_dispatch:
    inputs:
      flow:
        description: Single flow to run (e.g. 03-history). Empty runs all of them.
        required: false
        type: string

jobs:
  smoke:
    name: Fixture-backed smoke run
    # Blacksmith x64 Linux runner: nested virtualisation is supported, so the emulator gets KVM.
    # 8 vCPU / 32 GB is sized for the release Gradle build (the long pole) sharing the box with an
    # emulator that wants ~4 GB to itself; the 160 GB disk also fits the SDK + NDK + Gradle caches.
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 60

    # `fixtureBuildEnv` spreads the ambient environment into the build, so everything the app needs
    # baked in is set once here and reaches both `expo prebuild` and Gradle. No keystore: without
    # `VESCAPE_UPLOAD_STORE_FILE` the release variant falls back to debug signing
    # (`plugins/withAndroidSigningConfig.ts`), which is all an emulator run needs.
    env:
      EXPO_PUBLIC_SERVER_URL: https://api.vescape.app
      EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN }}
      EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
      EXPO_PUBLIC_MAPY_API_KEY: ${{ secrets.EXPO_PUBLIC_MAPY_API_KEY }}
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      # The release variant runs Sentry's sourcemap upload task, which fails without an org. This
      # build is thrown away with the emulator, so it has no release to publish — the fix is to skip
      # the upload rather than to hand CI a Sentry token for an artifact nobody will ever symbolicate.
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      # The emulator is x86_64, so the other three ABIs are compiled and then thrown away. Each one
      # is a full CMake build of the app plus every native module, and together they dominate the
      # run. `android/` is prebuild-generated, so the override has to arrive as a project property
      # from the environment rather than as an edit to `android/gradle.properties`.
      ORG_GRADLE_PROJECT_reactNativeArchitectures: x86_64
      GRADLE_OPTS: -Dorg.gradle.caching=true

    steps:
      - uses: actions/checkout@v4

      # Expo reads `app.config.ts` through `require(esm)` + `module.stripTypeScriptTypes`, neither of
      # which exists on the Node 20 the runner image ships. Pinned everywhere else in CI for the
      # same reason.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: useblacksmith/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-smoke-${{ runner.os }}-${{ hashFiles('bun.lock', 'app.config.ts') }}
          restore-keys: |
            gradle-smoke-${{ runner.os }}-

      - uses: android-actions/setup-android@v3

      # The SDK download, the JS install and the Maestro install share nothing, so they overlap.
      - parallel:
          - name: Install Android SDK components
            run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
          - name: Install dependencies
            run: bun install
          - name: Install Maestro
            run: |
              curl -Ls https://get.maestro.mobile.dev | bash
              echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # The emulator is unusably slow without nested virtualisation, and the runner does not grant
      # access to /dev/kvm by default. Kept while the Blacksmith move is unproven — drop it once a
      # run shows /dev/kvm is already world-writable there.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # `scripts/smoke.ts` owns everything device-side — the Release build, install, fixture push,
      # permission grants, location pin, flow order. The workflow only supplies a booted emulator,
      # so the CI run and a local one cannot drift apart.
      - name: Run smoke flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # No GPU on a hosted runner. Mapbox has to render through software GL, which is the part
          # of this run least likely to survive the move off a real device.
          emulator-options: >-
            -no-window -no-snapshot -no-boot-anim -gpu swiftshader_indirect
            -noaudio -camera-back none
          disable-animations: false
          script: bun run smoke --device emulator-5554 ${{ inputs.flow && format('--flow {0}', inputs.flow) || '' }}

      # Maestro writes a screenshot and a view hierarchy dump per failed step, which is the only way
      # to tell a real regression from a slow-runner race without reproducing it locally.
      - name: Upload Maestro debug output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug
          path: ~/.maestro/tests/
          if-no-files-found: warn
