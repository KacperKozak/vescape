# Return to the live telemetry home from whatever panel was just captured.
#
# Every dismissal goes through an on-screen affordance rather than `back`: Android's hardware back is
# handled by `useMainScreenController`, but iOS has no equivalent for overlay state (map, weather,
# legal limits and history are view states, not routes), and Maestro's `back` does not dismiss a
# JS-rendered drawer either. Tapping the control the rider taps keeps this flow identical on both
# platforms, which is the contract for the store set: one flow, two platforms, the same panels.
#
# Every exit lands straight on telemetry (`enterTelemetry`), so at most one branch fires.
appId: ${APP_ID}
---
- runFlow:
    when:
      visible:
        id: weather-exit
    commands:
      - tapOn:
          id: weather-exit
- runFlow:
    when:
      visible:
        id: legal-limits-exit
    commands:
      - tapOn:
          id: legal-limits-exit
- runFlow:
    when:
      visible:
        id: history-session-sheet-backdrop
    commands:
      - tapOn:
          id: history-session-sheet-backdrop
- runFlow:
    when:
      visible:
        id: history-back
    commands:
      - tapOn:
          id: history-back
- runFlow:
    when:
      visible:
        id: social-drawer-backdrop
    commands:
      - tapOn:
          id: social-drawer-backdrop
- runFlow:
    when:
      visible:
        id: header-back
    commands:
      - tapOn:
          id: header-back
- runFlow:
    when:
      visible:
        id: map-exit
    commands:
      - tapOn:
          id: map-exit
- extendedWaitUntil:
    visible:
      id: battery-bar
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 20000
